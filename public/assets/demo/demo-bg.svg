<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Stilisierte Trainingsfläche als neutraler Vorschau-Hintergrund (eigene Grafik, frei verwendbar) -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a414b"/>
      <stop offset="1" stop-color="#1d2127"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202328"/>
      <stop offset="1" stop-color="#0d0e10"/>
    </linearGradient>
    <radialGradient id="light" cx=".5" cy="0" r=".9">
      <stop offset="0" stop-color="#cfd8e3" stop-opacity=".55"/>
      <stop offset="1" stop-color="#cfd8e3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa8b8"/>
      <stop offset="1" stop-color="#5b6673"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#wall)"/>
  <!-- Fensterband -->
  <g opacity=".85">
    <rect x="120" y="90" width="380" height="300" fill="url(#window)"/>
    <rect x="540" y="90" width="380" height="300" fill="url(#window)"/>
    <rect x="1000" y="90" width="380" height="300" fill="url(#window)" opacity=".7"/>
    <rect x="1420" y="90" width="380" height="300" fill="url(#window)" opacity=".55"/>
    <g stroke="#2b3138" stroke-width="10">
      <line x1="310" y1="90" x2="310" y2="390"/><line x1="730" y1="90" x2="730" y2="390"/>
      <line x1="1190" y1="90" x2="1190" y2="390"/><line x1="1610" y1="90" x2="1610" y2="390"/>
    </g>
  </g>
  <ellipse cx="760" cy="0" rx="1100" ry="700" fill="url(#light)"/>
  <!-- Wandmarkierung für Wall Balls -->
  <rect x="1500" y="430" width="220" height="12" fill="#c8102e" opacity=".8"/>
  <!-- Boden -->
  <polygon points="0,690 1920,690 1920,1080 0,1080" fill="url(#floor)"/>
  <g stroke="#2c3036" stroke-width="3" opacity=".9">
    <line x1="960" y1="690" x2="-600" y2="1080"/><line x1="960" y1="690" x2="200" y2="1080"/>
    <line x1="960" y1="690" x2="960" y2="1080"/><line x1="960" y1="690" x2="1720" y2="1080"/>
    <line x1="960" y1="690" x2="2520" y2="1080"/>
    <line x1="0" y1="760" x2="1920" y2="760"/><line x1="0" y1="860" x2="1920" y2="860"/>
    <line x1="0" y1="990" x2="1920" y2="990"/>
  </g>
  <!-- Klimmzug-Rig -->
  <g fill="#0f1114">
    <rect x="560" y="300" width="26" height="420"/>
    <rect x="1330" y="300" width="26" height="420"/>
    <rect x="945" y="300" width="22" height="420"/>
    <rect x="540" y="300" width="840" height="22"/>
    <rect x="540" y="352" width="840" height="10" opacity=".8"/>
  </g>
  <!-- Hantelscheiben -->
  <g>
    <circle cx="300" cy="650" r="105" fill="#14161a"/><circle cx="300" cy="650" r="24" fill="#3b4048"/>
    <circle cx="330" cy="660" r="95" fill="#1a1d22"/><circle cx="330" cy="660" r="22" fill="#4a5059"/>
    <circle cx="1640" cy="655" r="100" fill="#14161a"/><circle cx="1640" cy="655" r="24" fill="#3b4048"/>
    <circle cx="1600" cy="665" r="90" fill="#1c1f24"/><circle cx="1600" cy="665" r="20" fill="#4a5059"/>
  </g>
  <!-- Langhantel am Boden -->
  <rect x="640" y="900" width="640" height="10" rx="5" fill="#8b929c"/>
  <circle cx="660" cy="905" r="88" fill="#121417" stroke="#2a2e34" stroke-width="6"/>
  <circle cx="1260" cy="905" r="88" fill="#121417" stroke="#2a2e34" stroke-width="6"/>
  <circle cx="660" cy="905" r="16" fill="#8b929c"/><circle cx="1260" cy="905" r="16" fill="#8b929c"/>
  <!-- Kettlebells -->
  <g fill="#0c0d0f">
    <circle cx="1460" cy="960" r="46"/><path d="M1430 920 q30 -60 60 0" stroke="#0c0d0f" stroke-width="14" fill="none"/>
    <circle cx="430" cy="970" r="40"/><path d="M404 935 q26 -52 52 0" stroke="#0c0d0f" stroke-width="12" fill="none"/>
  </g>
</svg>
