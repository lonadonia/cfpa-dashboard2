  <circle cx="150" cy="150" r="128" fill="none" stroke="#E30613" stroke-width="6"/>
  <g transform="translate(150 128)">
    <rect x="-92" y="-5" width="184" height="10" rx="3" fill="#d9dce1"/>
    <rect x="-80" y="-36" width="16" height="72" rx="3" fill="#E30613"/>
    <rect x="-62" y="-26" width="12" height="52" rx="3" fill="#ffffff"/>
    <rect x="64" y="-36" width="16" height="72" rx="3" fill="#E30613"/>
    <rect x="50" y="-26" width="12" height="52" rx="3" fill="#ffffff"/>
  </g>
  <text x="150" y="212" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="30" letter-spacing="3" fill="#ffffff">DEIN LOGO</text>
</svg>
